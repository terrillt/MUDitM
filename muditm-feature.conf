# MUDitM config for the feature environment (skmud-feature MacBook)
# Listens on 2026 (TLS auto-detect), forwards to MUD on 2027

[muditm]
demon = true
listen = 2026
listen-backlog = 16
max-children = 100
log-file = /Users/mud/SKMUD/log/muditm.log
newenv_ipaddress = IPADDRESS
newenv_immediate_ip = true
newenv_fallback = true
newenv_fallback_ms = 2000

[ssl]
cert = /Users/mud/SKMUD/src/externals/MUDitM/cert.pem
key = /Users/mud/SKMUD/src/externals/MUDitM/key.pem

[game]
host = 127.0.0.1
service = 2027
security = none
compression = enable

[client]
security = auto
compression = enable

[skmud]
control_socket = /Users/mud/SKMUD/control/control.sock
